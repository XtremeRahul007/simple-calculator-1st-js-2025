name: Update Language Stats

on:
  push:
    branches: [remastered]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: language-stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    name: Update README language table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloc jq

      - name: Generate stats table
        run: |
          cloc --vcs=git --json \
            --exclude-dir=.github \
            --exclude-lang=SVG,TOML,Markdown,JSON \
            . > stats.json

          jq -r '
            .SUM.code as $total
            | [to_entries[] | select(.key != "header" and .key != "SUM")]
            | sort_by(-.value.code)
            | (
                "| Language | Files | Lines of code | Share |",
                "| :--- | ---: | ---: | ---: |",
                (.[] | "| \(.key) | \(.value.nFiles) | \(.value.code) | \((.value.code / $total * 1000 | round) / 10)% |"),
                "| **Total** | **\(map(.value.nFiles) | add)** | **\($total)** | **100%** |"
              )
          ' stats.json > table.md

      - name: Update README
        run: |
          python3 - <<'PY'
          import re, pathlib

          readme = pathlib.Path("README.md")
          table = pathlib.Path("table.md").read_text().strip()
          block = f"<!-- LANG_STATS_START -->\n{table}\n<!-- LANG_STATS_END -->"

          pattern = re.compile(
              r"<!-- LANG_STATS_START -->.*?<!-- LANG_STATS_END -->", re.DOTALL
          )
          content = readme.read_text()
          if not pattern.search(content):
              raise SystemExit("Stats markers not found in README.md")

          # lambda avoids backslash/escape interpretation in the replacement
          readme.write_text(pattern.sub(lambda _: block, content))
          PY

      - name: Commit and push
        run: |
          if git diff --quiet README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update language stats [skip ci]"
          git push
